[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accalab"
version = "0.1.0"
description = "AccaLab API probe and football analysis platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23,<26",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "ortools>=9.10,<10",
    "scipy>=1.11,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["hypothesis>=6,<7", "pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
accalab = "accalab.cli:main"

[tool.setuptools.packages.find]
include = ["accalab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
